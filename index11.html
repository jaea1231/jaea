<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>폼 입력양식</h1>
    <form name='fm1' method="post" action="">
        아이디:<input type="text" name="t1" value=""><br>
        비밀번호:<input type="password" name="p1" value=""><br>
        <input type="button" name="b1" value="버튼1"><br>
        사용가능한 기술(모두선택)<br>
        <input type="checkbox" name="c1" value="체크박스1">HTML<br>
        <input type="checkbox" name="c2" value="체크박스2">CSS<br>
        <input type="checkbox" name="c3" value="체크박스3">JS<br>
        지원분야<br>
        <input type="radio" name="r1" value="라디오버튼1">프론트<br>
        <input type="radio" name="r1" value="라디오버튼2">벡엔드<br>
        <input type="radio" name="r1" value="라디오버튼3">풀스택<br>
        지원분야<br>
        <input type="radio" name="k1" value="라디오버튼1">프론트<br>
        <input type="radio" name="k1" value="라디오버튼2">벡엔드<br>
        <hr>
        <input type="hidden" name="h1" value="숨겨진값1"><br>
        <hr>
        <input type="file" name="f1"><br>
        좋아하는 과일:
        <select name="s1">
            <option value="sel1">사과</option>
            <option value="sel2">배</option>
            <option value="sel3" selected>포도</option>
            <option value="sel4">감</option>
        </select><br>
        <textarea name="ta1" rows="10" cols="50">초기 입력 문자열</textarea><br>
        <input type="submit" name="s1" value="전송"><br>
        <input type="reset" name="r1" value="리셋"><br>
    </form>
</body>
</html>

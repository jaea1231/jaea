<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글자모양 태그</title>
</head>
<body>
    <h1>글자모양</h1>
    삼육대학교 <b>인공지능융합학부</b><br>
    삼육대학교 <i>인공지능융합학부</i><br>
    삼육대학교 <small>인공지능융합학부</small><br>
    삼육대학교 <sub>인공지능융합학부</sub><br>
    삼육대학교 <sup>인공지능융합학부</sup><br>
    삼육대학교 <ins>인공지능융합학부</ins><br>
    삼육대학교 <del>인공지능융합학부</del><br>
    삼육대학교 <strong>인공지능융합학부</strong><br>
    삼육대학교 <em>인공지능융합학부</em><br>
    삼육대학교 <mark>인공지능융합학부</mark><br>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>나만의 계산기</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 30px 16px;
            background: #e8efe9;
            color: #16382d;
            font-family: system-ui, sans-serif;
        }
        main {
            max-width: 360px;
            margin: auto;
            padding: 22px;
            background: white;
            border-radius: 20px;
        }
        h1 { margin-top: 0; font-size: 24px; }
        h2 { font-size: 17px; }
        input, button { font: inherit; }
        input {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid #789389;
            border-radius: 8px;
            text-align: right;
        }
        output {
            display: block;
            min-height: 44px;
            padding: 8px 0;
            text-align: right;
            font-weight: bold;
            overflow-wrap: anywhere;
        }
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        button {
            min-height: 42px;
            border: none;
            border-radius: 8px;
            background: #eaf2ec;
            color: inherit;
            cursor: pointer;
        }
        .equals { background: #21634e; color: white; }
        ul { list-style: none; padding: 0; }
        li button {
            width: 100%;
            margin-bottom: 6px;
            padding: 8px;
            text-align: left;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <main>
        <h1>나만의 계산기</h1>

        <form id="calculator">
            <label for="expression">수식</label>
            <input id="expression" placeholder="예: (2+3)×4"
                   maxlength="120" autocomplete="off">
            <output id="result" for="expression" aria-live="polite"></output>

            <div class="keys">
                <button type="button" id="clear">AC</button>
                <button type="button" data-key="(">(</button>
                <button type="button" data-key=")">)</button>
                <button type="button" id="erase" aria-label="한 글자 지우기">⌫</button>

                <button type="button" data-key="7">7</button>
                <button type="button" data-key="8">8</button>
                <button type="button" data-key="9">9</button>
                <button type="button" data-key="÷">÷</button>

                <button type="button" data-key="4">4</button>
                <button type="button" data-key="5">5</button>
                <button type="button" data-key="6">6</button>
                <button type="button" data-key="×">×</button>

                <button type="button" data-key="1">1</button>
                <button type="button" data-key="2">2</button>
                <button type="button" data-key="3">3</button>
                <button type="button" data-key="-">−</button>

                <button type="button" data-key="0">0</button>
                <button type="button" data-key=".">.</button>
                <button type="button" data-key="+">+</button>
                <button type="submit" class="equals">=</button>
            </div>
        </form>

        <h2>최근 계산</h2>
        <ul id="history"></ul>
    </main>

    <script>
        const form = document.querySelector("#calculator");
        const input = document.querySelector("#expression");
        const result = document.querySelector("#result");
        const history = document.querySelector("#history");

        function calculate(expression) {
            const formula = expression
                .replaceAll("×", "*")
                .replaceAll("÷", "/")
                .replaceAll("−", "-");

            const tokens = (formula.match(/\d+(?:\.\d*)?|\.\d+|\s+|./gu) || [])
                .filter(token => token.trim() !== "");
            let position = 0;

            // 숫자, 음수, 괄호 안의 수식을 읽는다.
            function readValue() {
                const token = tokens[position++];

                if (token === "+") return readValue();
                if (token === "-") return -readValue();

                if (token === "(") {
                    const value = readSum();
                    if (tokens[position++] !== ")") {
                        throw new Error("닫는 괄호를 입력해 주세요.");
                    }
                    return value;
                }

                if (!/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(token ?? "")) {
                    throw new Error("수식을 확인해 주세요.");
                }
                return Number(token);
            }

            // 곱셈과 나눗셈을 먼저 계산한다.
            function readProduct() {
                let value = readValue();

                while (tokens[position] === "*" || tokens[position] === "/") {
                    const operator = tokens[position++];
                    const next = readValue();

                    if (operator === "/" && next === 0) {
                        throw new Error("0으로 나눌 수 없어요.");
                    }
                    value = operator === "*" ? value * next : value / next;
                }
                return value;
            }

            // 곱셈과 나눗셈을 처리한 값들을 더하거나 뺀다.
            function readSum() {
                let value = readProduct();

                while (tokens[position] === "+" || tokens[position] === "-") {
                    const operator = tokens[position++];
                    const next = readProduct();
                    value = operator === "+" ? value + next : value - next;
                }
                return value;
            }

            const answer = readSum();
            if (position !== tokens.length) {
                throw new Error("수식을 확인해 주세요.");
            }
            if (!Number.isFinite(answer)) {
                throw new Error("계산 범위를 넘었어요.");
            }
            return Number(answer.toPrecision(15));
        }

        document.querySelectorAll("[data-key]").forEach(button => {
            button.addEventListener("click", () => {
                if (input.value.length < input.maxLength) {
                    input.value += button.dataset.key;
                    result.value = "";
                }
            });
        });

        input.addEventListener("input", () => {
            result.value = "";
        });

        document.querySelector("#clear").addEventListener("click", () => {
            input.value = "";
            result.value = "";
        });

        document.querySelector("#erase").addEventListener("click", () => {
            input.value = input.value.slice(0, -1);
            result.value = "";
        });

        form.addEventListener("submit", event => {
            event.preventDefault();

            const expression = input.value.trim();
            if (!expression) return;

            try {
                const answer = calculate(expression);
                result.value = answer;

                const item = document.createElement("li");
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = expression + " = " + answer;

                button.addEventListener("click", () => {
                    input.value = expression;
                    result.value = answer;
                });

                item.append(button);
                history.prepend(item);

                if (history.children.length > 5) {
                    history.lastElementChild.remove();
                }
            } catch (error) {
                result.value = error.message;
            }
        });
    </script>
</body>
</html>

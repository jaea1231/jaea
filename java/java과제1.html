<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구구단</title>
</head>
<body>
    <h1>구구단 2~9단</h1>

    <script>
        for (let dan = 2; dan <= 9; dan++) {
            document.write("<h2>" + dan + "단</h2>");

            for (let num = 1; num <= 9; num++) {
                document.write(dan + " x " + num + " = " + (dan * num) + "<br>");
            }
        }
    </script>
</body>
</html>
